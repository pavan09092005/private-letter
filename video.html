<!DOCTYPE html>
    <html>
        <head><title>slap</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
                .box{
                    border: solid;
                    border-width: 1px;
                    display: inline-block;
                }
                .video{
                    width: 100px;
                    height: auto;
                    max-width:500px;

                }
                .next{
                    position:static;
                    top: 80%;
                    left: 48%;
                    background-color: transparent;
                    font-family: arial;
                    font-weight: bolder;
                    font-size: 50px;
                    border-width: 1px;
                    box-shadow: 2px 2px 8px black;
                    color:black;
                    cursor: pointer;
                }
                .next:active{
                    color: white;
                    background-color: black;
                    margin-top: 5px;
                    margin-left: 5px;
                }
            </style>
        </head>
        <body>
            <div class="box">
            <video class="video" 
            src="thumbnails/slapppp.mp4" autoplay muted loop>
            </video>
            <button class="next" 
            onclick="window.location.href='sher.html'"
            >Next</button>
            </div>
        </body>
    </html>
